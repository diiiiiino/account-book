<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Ledger V6 協作記帳</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .cursor-pointer { cursor: pointer; }
        .card-hover:hover { transform: translateY(-2px); transition: 0.3s; }
        .nav-link.active { background-color: #0d6efd !important; color: white !important; border-radius: 5px; }
        .invite-badge { cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); }
        .invite-badge:hover { background: rgba(255,255,255,0.4); }
        .action-btn { cursor: pointer; transition: 0.2s; }
        .action-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>

<!-- ================= 頁面 1: 登入/加入區 ================= -->
<div class="container mt-5" id="login-section">
    <div class="card shadow-lg border-0 mx-auto" style="max-width: 500px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary"><i class="fa-solid fa-wallet"></i> Co-Ledger</h2>
                <p class="text-muted">多人協作．權責分明．自動結算</p>
            </div>

            <ul class="nav nav-pills nav-fill mb-4">
                <li class="nav-item">
                    <button class="nav-link active bg-light text-dark" data-bs-toggle="pill" data-bs-target="#tab-create" onclick="this.classList.add('active');">建立新帳本</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link bg-light text-dark" data-bs-toggle="pill" data-bs-target="#tab-join">加入帳本</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- 建立 -->
                <div class="tab-pane fade show active" id="tab-create">
                    <div class="mb-3">
                        <label class="form-label">您的暱稱 (建立者)</label>
                        <input type="text" class="form-control" id="createName" placeholder="例如: Jun">
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg" onclick="initLedger('create')">✨ 建立並開始</button>
                    </div>
                </div>
                <!-- 加入 -->
                <div class="tab-pane fade" id="tab-join">
                    <div class="mb-3">
                        <label class="form-label">您的暱稱</label>
                        <input type="text" class="form-control" id="joinName" placeholder="例如: Feli">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">邀請代碼</label>
                        <input type="text" class="form-control text-uppercase" id="joinCode" placeholder="輸入代碼">
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-success btn-lg" onclick="initLedger('join')">🚀 加入群組</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ================= 頁面 2: 主應用程式 ================= -->
<div id="app-section" class="hidden">
    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-sack-dollar"></i> Co-Ledger</a>
            
            <div class="d-none d-md-flex align-items-center text-white ms-3 px-3 py-1 rounded invite-badge" onclick="copyCode()" title="點擊複製連結">
                <small class="me-2">邀請碼:</small>
                <span id="nav-invite-code" class="fw-bold font-monospace">Loading</span>
                <i class="fa-regular fa-copy ms-2"></i>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-3">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="switchView('dashboard', this)">
                            <i class="fa-solid fa-chart-line"></i> 儀表板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="switchView('ledger', this)">
                            <i class="fa-solid fa-list"></i> 詳細收支表
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white mt-2 mt-lg-0">
                    <button class="btn btn-sm btn-outline-light me-3" onclick="openMemberModal()">
                        <i class="fa-solid fa-users"></i> 成員 (<span id="member-count">0</span>)
                    </button>
                    <div class="dropdown">
                        <a class="text-white text-decoration-none dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-circle-user"></i> <span id="user-display">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="location.reload()">登出</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        
        <!-- === 視圖 1: 儀表板 (Dashboard) === -->
        <div id="view-dashboard">
            <!-- 數據卡片 -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card p-3 border-0 shadow-sm h-100 card-hover">
                        <h6 class="text-muted">總收支</h6>
                        <h3 id="dash-total" class="fw-bold">$0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 border-0 shadow-sm h-100 card-hover">
                        <h6 class="text-muted">撲滿現狀 (已結清)</h6>
                        <h3 id="dash-settled" class="fw-bold text-success">$0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 border-0 shadow-sm h-100 card-hover">
                        <h6 class="text-muted">未結清帳務</h6>
                        <h3 id="dash-unsettled" class="fw-bold text-danger">$0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 border-warning h-100 shadow-sm card-hover" style="background-color: #fffaf0;">
                        <h6 class="text-muted">未結清墊付 (債務)</h6>
                        <div id="dash-debt" class="mt-2 text-dark small fw-bold">無欠款</div>
                    </div>
                </div>
            </div>

            <!-- 圖表區 -->
            <div class="row mb-4">
                <!-- 左側：長條趨勢圖 -->
                <div class="col-md-7">
                    <div class="card border-0 shadow-sm p-3 h-100">
                        <div class="d-flex justify-content-between">
                            <h5 class="mb-0">近六月趨勢</h5>
                            <small class="text-muted">月份統計</small>
                        </div>
                        <div style="height: 250px;"><canvas id="mainChart"></canvas></div>
                    </div>
                </div>
                <!-- 右側：圓餅類別圖 -->
                <div class="col-md-5">
                    <div class="card border-0 shadow-sm p-3 h-100">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0">類別佔比</h5>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-danger active" onclick="updatePieChart('expense', this)">支出</button>
                                <button class="btn btn-outline-success" onclick="updatePieChart('income', this)">收入</button>
                            </div>
                        </div>
                        <div style="height: 220px; position: relative;">
                             <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 記一筆按鈕 (移到這裡比較顯眼) -->
            <div class="d-grid gap-2 mb-4">
                 <button class="btn btn-primary btn-lg p-3 shadow" onclick="openAddModal()">
                    <i class="fa-solid fa-plus-circle me-2"></i> 記一筆
                </button>
            </div>

            <!-- 未結清項目 -->
            <div class="card border-0 shadow-sm mb-5 border-start border-4 border-danger">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-danger"><i class="fa-solid fa-circle-exclamation"></i> 未結清項目</h5>
                    <small class="text-muted">勾選後將自動歸零債務</small>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th width="5%">結清</th>
                                <th>日期</th>
                                <th>事項</th>
                                <th>總額</th>
                                <th>墊付人</th>
                                <th>分攤詳情</th>
                            </tr>
                        </thead>
                        <tbody id="unsettled-list"></tbody>
                    </table>
                </div>
                <div class="card-body text-center text-muted py-5" id="unsettled-empty-msg">
                    <h5>🎉 太棒了！</h5>
                    <p>目前所有帳務都已結清，沒有待辦事項。</p>
                </div>
            </div>
        </div>

        <!-- === 視圖 2: 詳細收支表 === -->
        <div id="view-ledger" class="hidden">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">📜 所有收支明細</h5>
                    <div class="btn-group">
                        <button class="btn btn-outline-secondary btn-sm active" onclick="filterLedger('all', this)">全部</button>
                        <button class="btn btn-outline-success btn-sm" onclick="filterLedger('settled', this)">已結清</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="filterLedger('unsettled', this)">未結清</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>操作</th>
                                <th>日期</th>
                                <th>類別</th>
                                <th>事項</th>
                                <th>總金額</th>
                                <th>墊付人</th>
                                <th>權責分攤</th>
                                <th>狀態</th>
                            </tr>
                        </thead>
                        <tbody id="full-ledger-list"></tbody>
                    </table>
                </div>
                <div id="ledger-empty-msg" class="text-center py-5 text-muted hidden">
                    尚無任何記錄
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Modal: 新增/編輯記帳 -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">📝 新增記帳</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addForm">
                    <!-- 收支切換 -->
                    <div class="btn-group w-100 mb-3">
                        <input type="radio" class="btn-check" name="type" id="typeExp" value="expense" checked onchange="updateCategories()">
                        <label class="btn btn-outline-danger" for="typeExp">支出</label>
                        <input type="radio" class="btn-check" name="type" id="typeInc" value="income" onchange="updateCategories()">
                        <label class="btn btn-outline-success" for="typeInc">收入</label>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6"><label class="form-label">日期</label><input type="date" class="form-control" id="inDate"></div>
                        <div class="col-6"><label class="form-label">時間</label><input type="time" class="form-control" id="inTime"></div>
                    </div>
                    
                    <div class="mb-3"><label class="form-label">類別</label><select class="form-select" id="inCategory"></select></div>
                    <div class="mb-3"><label class="form-label">事項</label><input type="text" class="form-control" id="inItem" placeholder="例如: 晚餐"></div>
                    
                    <div class="card bg-light p-3 mb-3 border">
                        <div class="d-flex justify-content-between mb-2">
                            <label class="fw-bold text-dark">權責分配 (誰花的?)</label>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="splitEvenly()">平均分攤</button>
                        </div>
                        <div id="member-share-inputs" class="row g-2"></div>
                        <div class="text-end mt-2 fw-bold text-primary">總金額: <span id="displayTotal">0</span></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">付款方式 (誰墊付?)</label>
                        <div class="input-group">
                            <select class="form-select" id="inPayer"></select>
                            <select class="form-select" id="inMethod" style="max-width: 100px;">
                                <option value="現金">現金</option>
                                <option value="刷卡">刷卡</option>
                                <option value="匯款">匯款</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="inSettled">
                        <label class="form-check-label" for="inSettled">是否已結清</label>
                    </div>
                    <div class="mb-3"><textarea class="form-control" id="inNote" rows="2" placeholder="備註..."></textarea></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="btnSave" onclick="saveTransaction()">儲存</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: 成員管理 -->
<div class="modal fade" id="memberModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">群組成員</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="list-group mb-3" id="member-list-display"></ul>
                <div class="input-group">
                    <input type="text" class="form-control" id="newMemberName" placeholder="新成員名">
                    <button class="btn btn-outline-primary" onclick="addNewMember()">新增</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- 資料結構 ---
    let currentData = { user: '', code: '', members: [], transactions: [] };
    // 編輯模式變數
    let editingId = null;

    const expCats = ['飲食', '日常', '交通', '娛樂', '住宿', '其他', '未分類'];
    const incCats = ['薪水', '零用錢', '撲滿', '利息', '未分類'];

    // --- 初始化 ---
    function initLedger(mode) {
        let name = '';
        if (mode === 'create') {
            name = document.getElementById('createName').value.trim();
            if(!name) return alert('請輸入名字');
            currentData.code = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentData.members = [name]; 
        } else {
            name = document.getElementById('joinName').value.trim();
            const code = document.getElementById('joinCode').value.trim();
            if(!name || !code) return alert('請輸入名字與代碼');
            currentData.code = code.toUpperCase();
            currentData.members = ['Jun', name]; 
            if(!currentData.members.includes(name)) currentData.members.push(name);
        }
        currentData.user = name;
        enterApp();
    }

    function enterApp() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-display').innerText = currentData.user;
        document.getElementById('nav-invite-code').innerText = currentData.code;
        document.getElementById('inDate').valueAsDate = new Date();
        document.getElementById('inTime').value = new Date().toTimeString().slice(0,5);
        renderAll();
        updateCategories();
        showToast(`歡迎！您的邀請碼是 ${currentData.code}`);
    }

    function switchView(viewName, navEl) {
        document.getElementById('view-dashboard').classList.add('hidden');
        document.getElementById('view-ledger').classList.add('hidden');
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        if(navEl) navEl.classList.add('active');
        document.getElementById(`view-${viewName}`).classList.remove('hidden');
        if(viewName === 'ledger') renderFullTable(); else renderDashboard();
    }

    // --- 渲染邏輯 ---
    function renderAll() {
        renderDashboard();
        renderMemberOptions();
    }

    function renderDashboard() {
        let totalInc = 0, totalExp = 0, settledInc = 0, settledExp = 0, unsetInc = 0, unsetExp = 0;
        let debtMap = {}; 
        currentData.members.forEach(m => debtMap[m] = 0);

        const unsettledTbody = document.getElementById('unsettled-list');
        unsettledTbody.innerHTML = '';
        let hasUnsettled = false;

        currentData.transactions.forEach(t => {
            if(t.type === 'income') totalInc += t.total; else totalExp += t.total;
            if(t.settled) {
                if(t.type === 'income') settledInc += t.total; else settledExp += t.total;
            } else {
                if(t.type === 'income') unsetInc += t.total; else unsetExp += t.total;
                hasUnsettled = true;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="checkbox" class="form-check-input border-danger" onclick="toggleSettle(${t.id})" style="cursor:pointer; width: 20px; height: 20px;"></td>
                    <td>${t.date}</td>
                    <td>${t.item}</td>
                    <td class="text-danger fw-bold">-${t.total}</td>
                    <td>${t.payer}</td>
                    <td class="small text-muted">${formatShares(t.shares)}</td>
                `;
                unsettledTbody.appendChild(row);

                if (t.type === 'expense' && t.payer !== 'Split') {
                    if(debtMap[t.payer] !== undefined) debtMap[t.payer] += t.total; 
                    for (const [member, share] of Object.entries(t.shares)) {
                        if(debtMap[member] !== undefined) debtMap[member] -= share; 
                    }
                }
            }
        });

        document.getElementById('unsettled-empty-msg').style.display = hasUnsettled ? 'none' : 'block';
        document.getElementById('dash-total').innerText = `$ ${totalInc - totalExp}`;
        document.getElementById('dash-settled').innerText = `$ ${settledInc - settledExp}`;
        document.getElementById('dash-unsettled').innerText = `$ ${unsetInc - unsetExp}`;

        const debtEl = document.getElementById('dash-debt');
        let debtHtml = '';
        let noDebt = true;
        for (const [m, val] of Object.entries(debtMap)) {
            if (val > 0) { debtHtml += `<div class="text-primary">${m} 應收 $${val}</div>`; noDebt = false; }
            else if (val < 0) { debtHtml += `<div class="text-danger">${m} 應付 $${Math.abs(val)}</div>`; noDebt = false; }
        }
        debtEl.innerHTML = noDebt ? '<span class="text-success">無欠款</span>' : debtHtml;
        
        renderChart(); // 趨勢圖
        updatePieChart('expense'); // 類別圓餅圖 (預設支出)
    }

    // --- 圖表 1: 趨勢長條圖 ---
    let myChart = null;
    function renderChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        const labels = [], dataInc = [0,0,0,0,0,0], dataExp = [0,0,0,0,0,0];
        const today = new Date();
        for(let i=5; i>=0; i--) {
            const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
            labels.push(`${d.getMonth()+1}月`);
        }
        currentData.transactions.forEach(t => {
            const tDate = new Date(t.date);
            const diffMonth = (today.getFullYear() - tDate.getFullYear()) * 12 + (today.getMonth() - tDate.getMonth());
            if(diffMonth >= 0 && diffMonth <= 5) {
                const index = 5 - diffMonth;
                if(t.type === 'income') dataInc[index] += t.total; else dataExp[index] += t.total;
            }
        });
        myChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: [{ label: '支出', data: dataExp, backgroundColor: '#dc3545', borderRadius: 5 }, { label: '收入', data: dataInc, backgroundColor: '#198754', borderRadius: 5 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });
    }

    // --- 圖表 2: 類別圓餅圖 ---
    let pieChart = null;
    function updatePieChart(type, btn) {
        if(btn) {
            btn.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const ctx = document.getElementById('categoryChart').getContext('2d');
        if(pieChart) pieChart.destroy();

        // 統計類別數據
        const catMap = {};
        let hasData = false;
        currentData.transactions.filter(t => t.type === type).forEach(t => {
            catMap[t.category] = (catMap[t.category] || 0) + t.total;
            hasData = true;
        });

        const labels = Object.keys(catMap);
        const data = Object.values(catMap);
        const bgColors = ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff', '#ff9f40', '#c9cbcf'];

        pieChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: hasData ? labels : ['無資料'],
                datasets: [{
                    data: hasData ? data : [1],
                    backgroundColor: hasData ? bgColors : ['#e0e0e0']
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { position: 'right' } } 
            }
        });
    }

    // --- 記帳操作 (新增/編輯/刪除) ---

    // 1. 打開 Modal (判斷是新增還是編輯)
    function openAddModal(txId = null) {
        // 重置欄位
        document.getElementById('addForm').reset();
        document.getElementById('inDate').valueAsDate = new Date();
        document.getElementById('inTime').value = new Date().toTimeString().slice(0,5);
        document.getElementById('typeExp').checked = true;
        updateCategories();
        
        editingId = txId; // 設定目前是否在編輯模式

        const modalTitle = document.getElementById('modalTitle');
        const btnSave = document.getElementById('btnSave');

        if (txId) {
            // --- 編輯模式 ---
            modalTitle.innerText = "✏️ 編輯記帳";
            btnSave.innerText = "更新";
            
            // 填入資料
            const tx = currentData.transactions.find(t => t.id === txId);
            if(tx) {
                document.getElementById('inDate').value = tx.date;
                document.getElementById('inTime').value = tx.time;
                if(tx.type === 'income') document.getElementById('typeInc').checked = true;
                else document.getElementById('typeExp').checked = true;
                updateCategories();
                document.getElementById('inCategory').value = tx.category;
                document.getElementById('inItem').value = tx.item;
                document.getElementById('inMethod').value = tx.method;
                document.getElementById('inSettled').checked = tx.settled;
                document.getElementById('inNote').value = tx.note || '';
                
                // 產生輸入框並填值
                generateShareInputs();
                const inputs = document.querySelectorAll('.share-input');
                inputs.forEach(inp => {
                    const member = inp.dataset.member;
                    inp.value = tx.shares[member] || 0; // 若成員是後來加的，設為0
                });
                calculateTotal();

                // 填入付款人
                const payerSelect = document.getElementById('inPayer');
                if(tx.payer === 'Split' || currentData.members.includes(tx.payer)) {
                     payerSelect.value = tx.payer;
                }
            }
        } else {
            // --- 新增模式 ---
            modalTitle.innerText = "📝 新增記帳";
            btnSave.innerText = "儲存";
            generateShareInputs();
        }

        new bootstrap.Modal(document.getElementById('addModal')).show();
    }

    // 產生動態輸入框 (共用函式)
    function generateShareInputs() {
        const container = document.getElementById('member-share-inputs');
        container.innerHTML = '';
        const payerSelect = document.getElementById('inPayer');
        
        // 記住原本選的付款人(編輯時用到)
        const currentPayer = payerSelect.value;
        payerSelect.innerHTML = '<option value="Split">各自付 (AA制)</option>';

        currentData.members.forEach(m => {
            const col = document.createElement('div');
            col.className = 'col-6';
            col.innerHTML = `<label class="small text-muted">${m}</label><div class="input-group input-group-sm"><span class="input-group-text bg-white"><i class="fa-solid fa-user"></i></span><input type="number" class="form-control share-input" data-member="${m}" value="0" min="0"></div>`;
            container.appendChild(col);
            const opt = document.createElement('option');
            opt.value = m; opt.innerText = m + ' 墊付';
            payerSelect.appendChild(opt);
        });
        
        // 重新選回 (如果還在清單內)
        if(currentPayer) payerSelect.value = currentPayer;
        else payerSelect.value = currentData.user; // 預設選自己

        document.querySelectorAll('.share-input').forEach(inp => inp.addEventListener('input', calculateTotal));
    }

    function saveTransaction() {
        const type = document.querySelector('input[name="type"]:checked').value;
        const inputs = document.querySelectorAll('.share-input');
        let shares = {}, total = 0;
        inputs.forEach(inp => { const val = Number(inp.value); shares[inp.dataset.member] = val; total += val; });
        
        if(total === 0) { alert('金額不能為0'); return; }

        const txData = {
            id: editingId ? editingId : Date.now(), // 若是編輯，保留原本ID
            date: document.getElementById('inDate').value,
            time: document.getElementById('inTime').value,
            type: type, category: document.getElementById('inCategory').value,
            item: document.getElementById('inItem').value,
            shares: shares, total: total,
            payer: document.getElementById('inPayer').value,
            method: document.getElementById('inMethod').value,
            settled: document.getElementById('inSettled').checked,
            note: document.getElementById('inNote').value
        };

        if (editingId) {
            // 更新舊資料
            const idx = currentData.transactions.findIndex(t => t.id === editingId);
            if(idx !== -1) currentData.transactions[idx] = txData;
            showToast("已更新資料！");
        } else {
            // 新增資料
            currentData.transactions.push(txData);
            showToast("記帳成功！");
        }

        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        renderAll();
    }

    // 刪除功能
    function deleteTransaction(id) {
        if(confirm("確定要刪除這筆資料嗎？")) {
            currentData.transactions = currentData.transactions.filter(t => t.id !== id);
            renderAll();
            showToast("已刪除資料");
        }
    }

    function toggleSettle(id) {
        const idx = currentData.transactions.findIndex(t => t.id === id);
        if (idx !== -1) { currentData.transactions[idx].settled = true; showToast("✅ 已結清！"); renderDashboard(); }
    }

    // --- 表格渲染 ---
    let filterType = 'all';
    function filterLedger(type, btn) {
        filterType = type;
        btn.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderFullTable();
    }

    function renderFullTable() {
        const tbody = document.getElementById('full-ledger-list');
        tbody.innerHTML = '';
        let list = currentData.transactions.sort((a,b) => new Date(b.date) - new Date(a.date));
        if (filterType === 'settled') list = list.filter(t => t.settled);
        if (filterType === 'unsettled') list = list.filter(t => !t.settled);
        if(list.length === 0) document.getElementById('ledger-empty-msg').classList.remove('hidden');
        else document.getElementById('ledger-empty-msg').classList.add('hidden');
        
        list.forEach(t => {
            const tr = document.createElement('tr');
            const color = t.type === 'income' ? 'text-success' : 'text-danger';
            const sign = t.type === 'income' ? '+' : '-';
            const status = t.settled ? '<span class="badge bg-success">已結清</span>' : '<span class="badge bg-warning text-dark">未結清</span>';
            
            tr.innerHTML = `
                <td>
                    <i class="fa-solid fa-pen-to-square text-primary action-btn me-2" onclick="openAddModal(${t.id})" title="編輯"></i>
                    <i class="fa-solid fa-trash text-danger action-btn" onclick="deleteTransaction(${t.id})" title="刪除"></i>
                </td>
                <td>${t.date}</td>
                <td><span class="badge bg-light text-dark border">${t.category}</span></td>
                <td>${t.item} <div class="small text-muted fst-italic">${t.note}</div></td>
                <td class="${color} fw-bold">${sign}${t.total}</td>
                <td>${t.payer === 'Split' ? '各自' : t.payer}</td>
                <td class="small">${formatShares(t.shares)}</td>
                <td>${status}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- 輔助功能 ---
    function calculateTotal() {
        let sum = 0;
        document.querySelectorAll('.share-input').forEach(inp => sum += Number(inp.value));
        document.getElementById('displayTotal').innerText = sum;
    }

    function splitEvenly() {
        const inputs = document.querySelectorAll('.share-input');
        if(inputs.length === 0) return;
        const total = prompt("請輸入總金額，將自動平分：", "0");
        if(total && !isNaN(total)) {
            const per = Math.floor(total / inputs.length);
            let rem = total - (per * inputs.length);
            inputs.forEach((inp, idx) => { inp.value = (idx === 0) ? per + rem : per; });
            calculateTotal();
        }
    }

    // 成員管理 (修復黑屏)
    function renderMemberList() {
        const list = document.getElementById('member-list-display');
        list.innerHTML = '';
        currentData.members.forEach(m => {
            list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-user text-muted me-2"></i> ${m}</span>
            </li>`;
        });
        document.getElementById('member-count').innerText = currentData.members.length;
    }

    function openMemberModal() { renderMemberList(); new bootstrap.Modal(document.getElementById('memberModal')).show(); }

    function addNewMember() {
        const nameInput = document.getElementById('newMemberName');
        const name = nameInput.value.trim();
        if(name && !currentData.members.includes(name)) {
            currentData.members.push(name);
            nameInput.value = '';
            renderMemberList();
            renderMemberOptions();
            showToast(`成員 ${name} 已加入！`);
        } else if (currentData.members.includes(name)) { alert('該成員已在群組中'); }
    }
    
    function renderMemberOptions() { document.getElementById('member-count').innerText = currentData.members.length; }

    function updateCategories() {
        const type = document.querySelector('input[name="type"]:checked').value;
        const sel = document.getElementById('inCategory');
        sel.innerHTML = '';
        (type === 'income' ? incCats : expCats).forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function formatShares(sharesObj) { return Object.entries(sharesObj).filter(([k,v]) => v > 0).map(([k,v]) => `${k}:${v}`).join(', '); }
    function copyCode() { navigator.clipboard.writeText(document.getElementById('nav-invite-code').innerText).then(() => showToast("邀請碼已複製！")); }
    function showToast(msg) { Toastify({ text: msg, duration: 3000, style: { background: "linear-gradient(to right, #00b09b, #96c93d)" } }).showToast(); }
</script>
</body>
</html>
